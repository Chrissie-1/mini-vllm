global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Control plane: admission, routing, and the latency clients actually see.
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          plane: control

  # Compute plane: batching and KV cache behaviour, one series per worker.
  - job_name: workers
    static_configs:
      - targets: ["worker1:9100", "worker2:9100"]
        labels:
          plane: compute
