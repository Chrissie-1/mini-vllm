name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep torch single-threaded: runners are 2-core and thread thrash makes the
  # timing-sensitive scheduler tests flaky.
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  TORCH_THREADS: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  worker:
    name: worker (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fast lane: a tiny randomly-initialised checkpoint. Exercises every
          # code path in seconds, so a broken build fails before the download.
          - { model: "hf-internal-testing/tiny-random-gpt2", label: "tiny" }
          # Real weights, for the equivalence and benchmark assertions.
          - { model: "gpt2", label: "gpt2" }
    env:
      TEST_MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gpt2-v1

      - name: Install dependencies
        working-directory: worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check generated protobuf stubs are current
        run: |
          python -m grpc_tools.protoc -I proto \
            --python_out=worker/server/pb \
            --grpc_python_out=worker/server/pb \
            --pyi_out=worker/server/pb \
            proto/inference.proto
          sed -i 's/^import inference_pb2 as/from . import inference_pb2 as/' \
            worker/server/pb/inference_pb2_grpc.py
          git diff --exit-code worker/server/pb

      - name: Run tests
        working-directory: worker
        run: pytest -q

      - name: Verify the KV cache is a pure optimisation
        # Fails if cached and uncached decoding ever disagree. Only meaningful
        # against real weights.
        if: matrix.model == 'gpt2'
        run: python bench/bench_kv_cache.py --tokens 16,32

  gateway:
    name: gateway (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: gateway/go.mod

      - uses: arduino/setup-protoc@v3
        with:
          version: "27.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Generate bindings
        run: |
          protoc -I proto \
            --go_out=gateway/internal/pb --go_opt=paths=source_relative \
            --go-grpc_out=gateway/internal/pb --go-grpc_opt=paths=source_relative \
            proto/inference.proto

      - name: Tidy, vet, test, build
        working-directory: gateway
        run: |
          go mod tidy
          go vet ./...
          go test -race ./...
          go build ./...

  images:
    name: docker images
    runs-on: ubuntu-latest
    needs: [worker, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: end-to-end (compose)
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@v4

      - name: Bring the stack up
        run: docker compose up -d --build gateway worker1 worker2

      - name: Wait for the gateway to report a healthy worker
        run: |
          for i in $(seq 1 60); do
            if curl -sf localhost:8080/ready | grep -q '"ready":true'; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "gateway never became ready"; docker compose logs; exit 1

      - name: Generate through the full HTTP -> gRPC -> engine path
        run: |
          body=$(curl -sf -X POST localhost:8080/v1/completions \
            -H 'Content-Type: application/json' \
            -d '{"prompt":"Once upon a time","max_tokens":16}')
          echo "$body"
          echo "$body" | grep -q '"finish_reason"'
          echo "$body" | grep -q '"completion_tokens":16'

      - name: Check both planes export metrics
        run: |
          curl -sf localhost:8080/metrics | grep -q gateway_requests_total

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
